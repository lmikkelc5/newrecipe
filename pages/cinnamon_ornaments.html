<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../mystyle.css">
    <title>Cinnamon Ornaments</title>
</head>
<body>
    <h1>Cinnamon Ornaments</h1>

    <h3>Ingredients</h3>
    <ul>
        <li>1 cup applesauce</li>
        <li>½ cup cinnamon</li>
        <li>⅓ cup glue</li>
    </ul>

    <h3>Directions</h3>
    <ol>
        <li>Mix applesauce, cinnamon, and glue together.</li>
        <li>Roll out on cinnamon.</li>
    </ol>
</body>
</html>
