    <title>Salad</title>
</head>
<body>
    <h1>Salad</h1>

    <h3>Ingredients</h3>
    <ul>
        <li>1 large head romaine</li>
        <li>1 cup shredded Swiss</li>
        <li>1 cup cashews (I’ve substituted sugared pecans or almonds)</li>
        <li>¼ cup sweetened dried cranberries</li>
        <li>1 apple, cubed</li>
        <li>1 pear, cubed</li>
    </ul>
</body>
