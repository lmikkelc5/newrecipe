    <h1>Regular Buttercream Frosting</h1>

    <h3>Ingredients</h3>
    <ul>
        <li>⅓ cup butter</li>
        <li>4 ½ cups powdered sugar</li>
        <li>¼ cup milk</li>
        <li>1 ½ tsp vanilla</li>
    </ul>

    <h3>Directions</h3>
    <ol>
        <li>Mix butter, powdered sugar, milk, and vanilla, adding milk as needed.</li>
    </ol>

    <p>*To make chocolate, add ½ cup cocoa.</p>
</body>
