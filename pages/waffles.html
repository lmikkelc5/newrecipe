<body>
    <h1>Waffles</h1>

    <h3>Ingredients</h3>
    <ul>
        <li>1 ¾ cups flour</li>
        <li>1 or 2 Tbsp sugar</li>
        <li>1 Tbsp baking powder</li>
        <li>2 eggs</li>
        <li>1 ¾ cups milk</li>
        <li>½ cup oil</li>
    </ul>
