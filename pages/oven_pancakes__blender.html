<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../mystyle.css">
    <title>Oven Pancakes (blender)</title>
</head>
<body>
    <h1>Oven Pancakes (blender)</h1>

    <h3>Ingredients</h3>
    <ul>
        <li>6 eggs</li>
        <li>1 cup milk</li>
        <li>1 cup flour</li>
        <li>½ square butter</li>
    </ul>

    <h3>Directions</h3>
    <ol>
        <li>Mix eggs, milk, and flour in a blender.</li>
        <li>Melt butter in a 9x13 pan.</li>
        <li>Pour egg mixture on top.</li>
        <li>Bake at 375°F for 25 minutes.</li>
    </ol>
</body>
</html>
