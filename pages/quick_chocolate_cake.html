<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../mystyle.css">
    <title>Quick Chocolate Cake</title>
</head>
<body>
    <h1>Quick Chocolate Cake</h1>

    <h3>Ingredients</h3>
    <ul>
        <li>⅓ cup cocoa</li>
        <li>2 cups flour</li>
        <li>1 ½ cups sugar</li>
        <li>⅛ tsp salt</li>
        <li>¾ cup oil</li>
        <li>2 tsp vanilla</li>
        <li>2 eggs</li>
        <li>1 tsp baking soda</li>
        <li>1 cup cold water</li>
    </ul>
</body>
</html>
