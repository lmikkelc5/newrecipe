<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../mystyle.css">
    <title>Snickerdoodles</title>
</head>
<body>
    <h1>Snickerdoodles</h1>

    <h3>Ingredients</h3>
    <ul>
        <li>1 stick butter (½ cup)</li>
        <li>¾ cup sugar</li>
        <li>1 egg</li>
        <li>1 ½ cups flour</li>
        <li>1 tsp cream of tartar</li>
        <li>½ tsp baking soda</li>
    </ul>

    <h3>Directions</h3>
    <ol>
        <li>Bake at 375°F for 5-7 minutes or 400°F for 8-10 minutes.</li>
    </ol>
</body>
</html>
