<!DOCTYPE html>

    <title>Cloud Biscuits</title>
</head>
<body>
    <h1>Cloud Biscuits</h1>

    <h3>Ingredients</h3>
    <ul>
        <li>2 cups sifted flour</li>
        <li>1 Tbsp sugar</li>
        <li>4 tsp baking powder</li>
        <li>½ tsp salt</li>
        <li>½ cup margarine</li>
        <li>1 egg, beaten</li>
        <li>⅔ cup milk</li>
    </ul>

    <p>From Elizabeth Ralph.</p>
</body>
