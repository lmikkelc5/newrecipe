<body>
    <nav class="crumb"><a href="../desserts.html">← Desserts</a></nav>
    <h1>Creamy Vanilla Frosting</h1>

    <h3>Ingredients</h3>
    <ul>
        <li>3 cups powdered sugar</li>
        <li>⅓ cup margarine, softened</li>
        <li>1 ½ tsp vanilla</li>
        <li>2 Tbsp milk</li>
    </ul>

    <h3>Directions</h3>
    <ol>
        <li>Mix sugar and margarine.</li>
        <li>Stir in vanilla and milk.</li>
        <li>Beat until smooth.</li>
    </ol>
</body>
