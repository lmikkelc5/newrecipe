    <h1>Oven Pancakes</h1>
    <p class="needs-work"><strong>Needs work:</strong> Only the serving step is here; mixing and baking are missing.</p>

    <h3>Ingredients</h3>
    <ul>
        <li>4 Tbsp butter</li>
        <li>6 eggs</li>
        <li>1 cup flour</li>
        <li>1 cup milk</li>
        <li>½ tsp salt</li>
        <li>Powdered sugar</li>
        <li>Syrup</li>
    </ul>

    <h3>Directions</h3>
    <ol>
        <li>Sprinkle with powdered sugar and serve with syrup.</li>
    </ol>
