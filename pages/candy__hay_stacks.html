<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../mystyle.css">
    <title>(Candy) Hay Stacks</title>
</head>
<body>
    <h1>(Candy) Hay Stacks</h1>

    <h3>Ingredients</h3>
    <ul>
        <li>2 packages butterscotch pieces</li>
        <li>1 can chow mein noodles</li>
        <li>1 cup salted peanuts</li>
    </ul>

    <h3>Directions</h3>
    <ol>
        <li>Melt butterscotch.</li>
        <li>Add noodles and peanuts.</li>
        <li>Drop onto wax paper in small clusters.</li>
    </ol>
</body>
</html>
